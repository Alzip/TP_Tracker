name: Access regression source snapshot
on:
  push:
    branches: ['fix/vanilla-lanayru-access']
    paths: ['.github/workflows/access-source-snapshot.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Export exact source for offline regression testing
        run: git archive --format=zip --output=access-source.zip HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: access-source
          path: access-source.zip
          retention-days: 1
