name: Desert tracking source snapshot
on:
  push:
    branches: ['fix/vanilla-desert-checks']
    paths: ['.github/workflows/desert-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Package exact tracker and pinned public reference sources
        shell: bash
        run: |
          mkdir -p snapshot/native snapshot/randomizer
          git archive --format=zip --output=snapshot/tracker-source.zip HEAD
          base=https://raw.githubusercontent.com/TwilitRealm/dusklight/40457c6adb381928e4b5fef6ed459ed291edd5e2
          for f in src/d/d_com_inf_game.cpp include/d/d_com_inf_game.h src/d/d_save.cpp include/d/d_save.h src/d/actor/d_a_tbox.cpp include/d/actor/d_a_tbox.h src/d/actor/d_a_tbox2.cpp src/d/actor/d_a_obj_mie.cpp; do
            mkdir -p "snapshot/native/$(dirname "$f")"
            curl --fail --location --retry 2 "$base/$f" -o "snapshot/native/$f"
          done
          git clone --depth 1 https://github.com/TwilitRealm/dusklight-randomizer.git snapshot/randomizer/repo
          git -C snapshot/randomizer/repo fetch --depth 1 origin d0ceae8f18bbef4a40287a72a2791a3c06c9aca5
          git -C snapshot/randomizer/repo archive --format=zip --output=../randomizer-source.zip FETCH_HEAD
          rm -rf snapshot/randomizer/repo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desert-tracking-source
          path: snapshot/
          retention-days: 3
          if-no-files-found: error
