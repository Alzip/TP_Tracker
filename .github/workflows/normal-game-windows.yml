name: Normal game - Windows x64

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: normal-game-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build and verify for Dusklight 2.0.3
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build, test and package Windows x64
        shell: pwsh
        run: ./tools/build_windows_vanilla.ps1 -Generator 'Visual Studio 17 2022' -BuildDirectory build-windows-vanilla

      - name: Record package and source revision
        shell: pwsh
        run: |
          $Info = Get-Content dist/BUILD_INFO.json -Raw | ConvertFrom-Json
          @"
          ## Windows x64 normal-game build
          - Source: ``$($Info.source_revision)``
          - Target host: Dusklight ``$($Info.target_dusklight)``
          - Package: ``$($Info.package)``
          - SHA-256: ``$($Info.sha256)``
          - CTest, asset checks and native metadata verification passed.
          - Gameplay with the user's save remains untested.
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload installable Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: TPTracker-normal-game-windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 30
